name: Charles PT-BR experimental APK
on:
  push:
    branches:
      - charles-ptbr-experimental
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 37 preview SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate sources and assemble isolated debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Charles-PTBR-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
